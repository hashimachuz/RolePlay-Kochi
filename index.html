<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Kochi RolePlay 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #70b0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Top UI Header */
        .top-ui {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .profile-badge {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #141c2b;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stat-chip {
            background: rgba(18, 30, 49, 0.85);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        /* Mobile Controls */
        #joystick-container {
            position: absolute;
            bottom: 24px;
            left: 24px;
            width: 110px;
            height: 110px;
            background: rgba(50, 75, 100, 0.4);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: rgba(220, 240, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
        }

        .action-buttons {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .action-btn {
            width: 58px;
            height: 58px;
            background: rgba(20, 32, 50, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .action-btn:active {
            background: rgba(40, 70, 110, 0.9);
            transform: scale(0.95);
        }
    </style>
    <!-- Three.js + GLTFLoader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div class="top-ui">
        <div class="profile-badge"></div>
        <div class="stat-chip">HP: 100</div>
        <div class="stat-chip">₹ 25,000</div>
        <div class="stat-chip">KOCHI - MARINE DRIVE</div>
        <div class="stat-chip" id="cam-mode-text">CAM: NORMAL</div>
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <div class="action-buttons">
        <div class="action-btn" id="btn-run">RUN</div>
        <div class="action-btn" id="btn-jump">JUMP</div>
        <div class="action-btn" id="btn-cam">CAM</div>
    </div>

    <canvas id="webgl-canvas"></canvas>

    <script>
        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x70b0ff);
        scene.fog = new THREE.FogExp2(0x70b0ff, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        // 2. Lighting Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff7e6, 0.9);
        dirLight.position.set(50, 80, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Environment: Kochi Ground, Clean Roads & Sea
        // Ground Grass
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e6f40 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Clean Kochi Marine Drive Asphalt Road
        const roadGeo = new THREE.PlaneGeometry(16, 300);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x222225 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, 0.02, 0);
        road.receiveShadow = true;
        scene.add(road);

        // Single White Dashed Center Line
        for (let z = -140; z < 140; z += 10) {
            const lineGeo = new THREE.PlaneGeometry(0.3, 5);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.03, z);
            scene.add(line);
        }

        // Ocean Water (Marine Drive Waterfront)
        const seaGeo = new THREE.PlaneGeometry(120, 300);
        const seaMat = new THREE.MeshLambertMaterial({ color: 0x006699, transparent: true, opacity: 0.85 });
        const ocean = new THREE.Mesh(seaGeo, seaMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.set(-68, -0.2, 0);
        scene.add(ocean);

        // 4. Default Procedural Fallback Car Mesh
        function createDefaultCarMesh() {
            const carGroup = new THREE.Group();
            
            // Car Body
            const bodyGeo = new THREE.BoxGeometry(2, 0.9, 4.2);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0xd92027 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            carGroup.add(body);

            // Car Roof
            const roofGeo = new THREE.BoxGeometry(1.6, 0.7, 2.2);
            const roofMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 1.35, -0.2);
            carGroup.add(roof);

            // 4 Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
            const wheelPos = [
                [-1.05, 0.4, 1.2],
                [1.05, 0.4, 1.2],
                [-1.05, 0.4, -1.2],
                [1.05, 0.4, -1.2]
            ];
            wheelPos.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                carGroup.add(wheel);
            });

            return carGroup;
        }

        // 5. Vehicle Entity Handling
        let carRoot = null;
        const carLoader = new THREE.GLTFLoader();

        // Attempting to load car.glb safely
        carLoader.load(
            'car.glb',
            function (gltf) {
                carRoot = gltf.scene;
                carRoot.scale.set(0.9, 0.9, 0.9);
                carRoot.position.set(0, 0, 0);
                scene.add(carRoot);
            },
            undefined,
            function (err) {
                // If car.glb missing or fails, load default vehicle seamlessly
                carRoot = createDefaultCarMesh();
                carRoot.position.set(0, 0, 0);
                scene.add(carRoot);
            }
        );

        // 6. Driving Physics & Input Logic
        const moveState = { forward: 0, turn: 0 };
        let speed = 0;
        let carAngle = 0;

        // Joystick Controls
        const joyContainer = document.getElementById('joystick-container');
        const joyKnob = document.getElementById('joystick-knob');
        let touchOrigin = null;

        joyContainer.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchOrigin = { x: touch.clientX, y: touch.clientY };
        }, { passive: false });

        joyContainer.addEventListener('touchmove', (e) => {
            if (!touchOrigin) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchOrigin.x;
            const dy = touch.clientY - touchOrigin.y;
            const dist = Math.min(Math.hypot(dx, dy), 35);
            const angle = Math.atan2(dy, dx);

            const nx = Math.cos(angle) * dist;
            const ny = Math.sin(angle) * dist;
            joyKnob.style.transform = `translate(${nx}px, ${ny}px)`;

            moveState.turn = -(nx / 35);
            moveState.forward = -(ny / 35);
        }, { passive: false });

        const resetJoy = () => {
            touchOrigin = null;
            joyKnob.style.transform = `translate(0px, 0px)`;
            moveState.forward = 0;
            moveState.turn = 0;
        };

        joyContainer.addEventListener('touchend', resetJoy);
        joyContainer.addEventListener('touchcancel', resetJoy);

        // Keyboard Controls Fallback
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') moveState.forward = 1;
            if (e.key === 'ArrowDown' || e.key === 's') moveState.forward = -1;
            if (e.key === 'ArrowLeft' || e.key === 'a') moveState.turn = 1;
            if (e.key === 'ArrowRight' || e.key === 'd') moveState.turn = -1;
        });
        window.addEventListener('keyup', (e) => {
            if (['ArrowUp', 'ArrowDown', 'w', 's'].includes(e.key)) moveState.forward = 0;
            if (['ArrowLeft', 'ArrowRight', 'a', 'd'].includes(e.key)) moveState.turn = 0;
        });

        // 7. Animation Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (carRoot) {
                // Acceleration & Friction
                speed += moveState.forward * 22 * delta;
                speed *= 0.95; // Drag

                // Steering
                if (Math.abs(speed) > 0.1) {
                    carAngle += moveState.turn * 2.2 * (speed > 0 ? 1 : -1) * delta;
                }

                carRoot.rotation.y = carAngle;
                carRoot.position.x += Math.sin(carAngle) * speed * delta;
                carRoot.position.z += Math.cos(carAngle) * speed * delta;

                // Smooth Third-Person Camera Follow
                const camOffset = new THREE.Vector3(
                    -Math.sin(carAngle) * 9,
                    4.5,
                    -Math.cos(carAngle) * 9
                );
                camera.position.lerp(carRoot.position.clone().add(camOffset), 0.1);
                camera.lookAt(carRoot.position.x, carRoot.position.y + 1.2, carRoot.position.z);
            }

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
