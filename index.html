<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kochi 3D - Open World HD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78b9df;font-family:'Segoe UI',Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;color:#fff;pointer-events:none}

/* Compact Clean HUD */
.top-hud-left{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:6px;background:rgba(15,23,42,0.8);backdrop-filter:blur(6px);padding:6px 12px;border-radius:18px;border:1px solid rgba(255,255,255,0.3);box-shadow:0 4px 10px rgba(0,0,0,0.3)}
.heart-icon{font-size:13px}
.bar-bg{width:85px;height:7px;background:rgba(0,0,0,0.85);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,0.4)}
.bar-fill{width:100%;height:100%;background:#22c55e}

.top-hud-right{position:absolute;right:14px;top:14px;background:rgba(15,23,42,0.8);backdrop-filter:blur(6px);padding:6px 14px;border-radius:18px;border:1px solid rgba(255,255,255,0.3);font-size:14px;font-weight:900;color:#22c55e;letter-spacing:0.5px;box-shadow:0 4px 10px rgba(0,0,0,0.3)}

/* Controls */
.joy{position:absolute;left:20px;bottom:24px;width:130px;height:130px;border:2px solid rgba(255,255,255,0.4);border-radius:50%;background:rgba(0,0,0,0.25);pointer-events:auto}
.stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,0.4);border:2px solid rgba(255,255,255,0.8)}
#look{position:absolute;left:160px;right:0;top:60px;bottom:0;pointer-events:auto}
.cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:2px solid #fff;border-radius:50%;opacity:0.8}

.buttons{position:absolute;right:16px;bottom:20px;display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.btn{min-width:62px;height:54px;border:2px solid rgba(255,255,255,0.5);border-radius:27px;background:rgba(0,0,0,0.65);color:#fff;font-weight:800;font-size:11px;cursor:pointer}
.btn:active{background:rgba(255,255,255,0.3)}

#enter-btn{background:#eab308;color:#000;display:none;font-weight:900}

.pedal-box{display:none;gap:10px;align-items:flex-end}
.btn-pedal{width:60px;height:80px;border-radius:12px;border:2px solid rgba(255,255,255,0.6);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center}
#accel-btn{background:rgba(34,197,94,0.75)}
#accel-btn:active{background:rgba(34,197,94,1)}
#brake-btn{background:rgba(239,68,68,0.75)}
#brake-btn:active{background:rgba(239,68,68,1)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="top-hud-left">
    <span class="heart-icon">❤️</span>
    <div class="bar-bg"><div class="bar-fill" id="hp-bar"></div></div>
  </div>

  <div class="top-hud-right">
    ₹ 25,000
  </div>

  <div id="look"><div class="cross"></div></div>
  <div class="joy" id="joy"><div class="stick" id="stick"></div></div>
  <div class="buttons">
    <button class="btn" id="enter-btn">ENTER</button>

    <div id="foot-buttons" style="display:flex;gap:8px;">
      <button class="btn" id="run">RUN</button>
      <button class="btn" id="jump">JUMP</button>
    </div>

    <div id="vehicle-pedals" class="pedal-box">
      <div class="btn-pedal" id="brake-btn">BRAKE<br>REV</div>
      <div class="btn-pedal" id="accel-btn">GAS</div>
    </div>

    <button class="btn" id="cam">CAM</button>
  </div>
</div>

<script>
'use strict';

// 1. ENGINE AUDIO SYNTHESIZER
let audioCtx = null;
let oscBass = null, oscMid = null;
let engineMaster = null;
let lastStepTime = 0;

function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();

  engineMaster = audioCtx.createGain();
  engineMaster.gain.setValueAtTime(0, audioCtx.currentTime);
  engineMaster.connect(audioCtx.destination);

  oscBass = audioCtx.createOscillator();
  oscBass.type = 'sawtooth';
  oscBass.frequency.setValueAtTime(32, audioCtx.currentTime);

  const bassFilter = audioCtx.createBiquadFilter();
  bassFilter.type = 'lowpass';
  bassFilter.frequency.setValueAtTime(140, audioCtx.currentTime);
  oscBass.connect(bassFilter);
  bassFilter.connect(engineMaster);
  oscBass.start();

  oscMid = audioCtx.createOscillator();
  oscMid.type = 'triangle';
  oscMid.frequency.setValueAtTime(64, audioCtx.currentTime);

  const midFilter = audioCtx.createBiquadFilter();
  midFilter.type = 'bandpass';
  midFilter.frequency.setValueAtTime(260, audioCtx.currentTime);
  midFilter.Q.setValueAtTime(2.0, audioCtx.currentTime);
  oscMid.connect(midFilter);
  midFilter.connect(engineMaster);
  oscMid.start();
}

function playCarDoorFull() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const clickOsc = audioCtx.createOscillator();
  const clickGain = audioCtx.createGain();
  clickOsc.frequency.setValueAtTime(800, t);
  clickOsc.frequency.exponentialRampToValueAtTime(100, t + 0.05);
  clickGain.gain.setValueAtTime(0.3, t);
  clickGain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
  clickOsc.connect(clickGain);
  clickGain.connect(audioCtx.destination);
  clickOsc.start(t);
  clickOsc.stop(t + 0.05);
}

function playFootstep() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(160, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

window.addEventListener('pointerdown', () => {
  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false });

// 2. HIGH DEFINITION CRISP RENDERER
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); // Native Crisp HD
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7fc0ec);
scene.fog = new THREE.Fog(0x7fc0ec, 100, 520);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.2, 600);

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d6642, 0.85);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xfffaed, 1.15);
dirLight.position.set(120, 180, 90);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

// 3. WIDE RACING ROADS & METRO
const BLOCK_SIZE = 100; 
const ROAD_WIDTH = 22; 
const HALF_ROAD = ROAD_WIDTH / 2;
const SIDEWALK_W = 2.8; 
const GRID_MIN = -2; 
const GRID_MAX = 2;  
const colliders = [];

// Ground Lawn
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ color: 0x24582a, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1d20, roughness: 0.8 });
const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.85 });
const yellowLineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

const roadCoords = [];
for (let i = GRID_MIN; i <= GRID_MAX; i++) roadCoords.push(i * BLOCK_SIZE);

const TOTAL_SPAN = (GRID_MAX - GRID_MIN) * BLOCK_SIZE + 240;
const CENTER_OFFSET = ((GRID_MAX + GRID_MIN) * BLOCK_SIZE) / 2;

// North-South Roads
roadCoords.forEach(rx => {
  const rZ = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, TOTAL_SPAN), roadMat);
  rZ.rotation.x = -Math.PI / 2;
  rZ.position.set(rx, 0.02, CENTER_OFFSET);
  rZ.receiveShadow = true;
  scene.add(rZ);

  [-1, 1].forEach(side => {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(SIDEWALK_W, 0.14, TOTAL_SPAN), sidewalkMat);
    sw.position.set(rx + side * (HALF_ROAD + SIDEWALK_W / 2), 0.07, CENTER_OFFSET);
    sw.receiveShadow = true;
    scene.add(sw);
  });

  const yl = new THREE.Mesh(new THREE.PlaneGeometry(0.3, TOTAL_SPAN), yellowLineMat);
  yl.rotation.x = -Math.PI / 2;
  yl.position.set(rx, 0.03, CENTER_OFFSET);
  scene.add(yl);
});

// East-West Roads
roadCoords.forEach(rz => {
  const rX = new THREE.Mesh(new THREE.PlaneGeometry(TOTAL_SPAN, ROAD_WIDTH), roadMat);
  rX.rotation.x = -Math.PI / 2;
  rX.position.set(CENTER_OFFSET, 0.022, rz);
  rX.receiveShadow = true;
  scene.add(rX);

  [-1, 1].forEach(side => {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(TOTAL_SPAN, 0.14, SIDEWALK_W), sidewalkMat);
    sw.position.set(CENTER_OFFSET, 0.07, rz + side * (HALF_ROAD + SIDEWALK_W / 2));
    sw.receiveShadow = true;
    scene.add(sw);
  });

  const yl = new THREE.Mesh(new THREE.PlaneGeometry(TOTAL_SPAN, 0.3), yellowLineMat);
  yl.rotation.x = -Math.PI / 2;
  yl.position.set(CENTER_OFFSET, 0.032, rz);
  scene.add(yl);
});

// SINGLE CENTER PILLAR METRO SYSTEM
const pillarMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.7 });
const trackDeckMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });

for (let pz = -380; pz <= 380; pz += 35) {
  const centerPillar = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.15, 8.5, 12), pillarMat);
  centerPillar.position.set(0, 4.25, pz);
  centerPillar.castShadow = true;
  scene.add(centerPillar);

  const pierCap = new THREE.Mesh(new THREE.BoxGeometry(6.4, 1.2, 2.2), pillarMat);
  pierCap.position.set(0, 8.5, pz);
  pierCap.castShadow = true;
  scene.add(pierCap);

  colliders.push({ minX: -1.2, maxX: 1.2, minZ: pz - 1.2, maxZ: pz + 1.2 });
}

const trackDeck = new THREE.Mesh(new THREE.BoxGeometry(6.0, 0.7, TOTAL_SPAN), trackDeckMat);
trackDeck.position.set(0, 9.1, CENTER_OFFSET);
trackDeck.castShadow = true;
scene.add(trackDeck);

// Metro Train
const metroTrain = new THREE.Group();
const coachBodyMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.3 });
const coachStripeMat = new THREE.MeshStandardMaterial({ color: 0x00a3c4, roughness: 0.4 });

for (let c = -1; c <= 1; c++) {
  const coach = new THREE.Group();
  const cBody = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.5, 13), coachBodyMat);
  cBody.position.y = 1.25;
  coach.add(cBody);

  const cStripe = new THREE.Mesh(new THREE.BoxGeometry(2.85, 0.45, 13.02), coachStripeMat);
  cStripe.position.y = 1.15;
  coach.add(cStripe);

  coach.position.z = c * 14.0;
  metroTrain.add(coach);
}
metroTrain.position.set(0, 9.7, 0);
scene.add(metroTrain);
let trainSpeed = 26.0;

// Trees & Buildings
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3e27, roughness: 0.9 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x1d6a2a, roughness: 0.7 });

function addPalmTree(x, z) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 6.0, 8), trunkMat);
  trunk.position.y = 3.0;
  trunk.castShadow = true;
  tree.add(trunk);

  const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.9, 8, 6), leafMat);
  leaves.scale.set(1.5, 0.35, 1.5);
  leaves.position.y = 5.8;
  leaves.castShadow = true;
  tree.add(leaves);

  tree.position.set(x, 0, z);
  scene.add(tree);
}

const bldgMatA = new THREE.MeshStandardMaterial({ color: 0x0f2b48, metalness: 0.7, roughness: 0.3 });
const bldgMatB = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.6 });

for (let bx = GRID_MIN; bx < GRID_MAX; bx++) {
  for (let bz = GRID_MIN; bz < GRID_MAX; bz++) {
    const lotCenterX = bx * BLOCK_SIZE + BLOCK_SIZE / 2;
    const lotCenterZ = bz * BLOCK_SIZE + BLOCK_SIZE / 2;

    const bw = 32, bd = 32;
    const bh = 20 + ((Math.abs(bx * 7 + bz * 13)) % 20);
    const bMesh = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), (bx % 2 === 0) ? bldgMatA : bldgMatB);
    bMesh.position.set(lotCenterX, bh / 2, lotCenterZ);
    bMesh.castShadow = true;
    bMesh.receiveShadow = true;
    scene.add(bMesh);

    addPalmTree(lotCenterX - 22, lotCenterZ - 22);
    addPalmTree(lotCenterX + 22, lotCenterZ + 22);

    colliders.push({
      minX: lotCenterX - bw / 2, maxX: lotCenterX + bw / 2,
      minZ: lotCenterZ - bd / 2, maxZ: lotCenterZ + bd / 2
    });
  }
}

// 4. PLAYER CHARACTER RIG
const playerGroup = new THREE.Group();
scene.add(playerGroup);

const skinMat = new THREE.MeshStandardMaterial({ color: 0x8a5531, roughness: 0.8 });
const shirtMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.7 });
const jeansMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
const shoeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

// Pelvis anchor for proper seated alignment
const pelvis = new THREE.Group();
pelvis.position.y = 0.92;
playerGroup.add(pelvis);

const torsoMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.28, 0.72, 10), shirtMat);
torsoMesh.position.y = 0.36;
torsoMesh.castShadow = true;
pelvis.add(torsoMesh);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), skinMat);
head.position.y = 0.96;
head.castShadow = true;
pelvis.add(head);

// Left Arm
const armL = new THREE.Group();
armL.position.set(-0.42, 0.63, 0);
const armLMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.62, 8), skinMat);
armLMesh.position.y = -0.31;
armLMesh.castShadow = true;
armL.add(armLMesh);
pelvis.add(armL);

// Right Arm
const armR = new THREE.Group();
armR.position.set(0.42, 0.63, 0);
const armRMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.62, 8), skinMat);
armRMesh.position.y = -0.31;
armRMesh.castShadow = true;
armR.add(armRMesh);
pelvis.add(armR);

// Left Leg
const legL = new THREE.Group();
legL.position.set(-0.2, 0, 0);
const legLMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.11, 0.78, 8), jeansMat);
legLMesh.position.y = -0.39;
legLMesh.castShadow = true;
legL.add(legLMesh);
const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.14, 0.32), shoeMat);
shoeL.position.set(0, -0.78, 0.06);
shoeL.castShadow = true;
legL.add(shoeL);
pelvis.add(legL);

// Right Leg
const legR = new THREE.Group();
legR.position.set(0.2, 0, 0);
const legRMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.11, 0.78, 8), jeansMat);
legRMesh.position.y = -0.39;
legRMesh.castShadow = true;
legR.add(legRMesh);
const shoeR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.14, 0.32), shoeMat);
shoeR.position.set(0, -0.78, 0.06);
shoeR.castShadow = true;
legR.add(shoeR);
pelvis.add(legR);

// 5. SOLID MULTIPLE VEHICLES (SPORTS CAR, BIKE, BUS)
const vehicles = [];

// SPORTS CAR
function createSportsCar(x, z) {
  const v = {
    type: 'car',
    group: new THREE.Group(),
    x: x, z: z,
    speed: 0, maxSpeed: 40, accel: 28, friction: 7.5, angle: 0,
    radius: 1.4,
    box: { w: 2.2, d: 4.4 },
    wheels: [],
    sound: { bass: 35, bassR: 90, mid: 65, midR: 190 }
  };

  const carPaint = new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.85, roughness: 0.25 });
  const carTrim = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 });

  const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.48, 4.3), carPaint);
  chassis.position.y = 0.46;
  chassis.castShadow = true;
  v.group.add(chassis);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.54, 2.2), carTrim);
  cabin.position.set(0, 0.92, -0.25);
  cabin.castShadow = true;
  v.group.add(cabin);

  const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.35, 16);
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85 });

  [[-1.08, 0.38, 1.3], [1.08, 0.38, 1.3], [-1.08, 0.38, -1.3], [1.08, 0.38, -1.3]].forEach(pos => {
    const w = new THREE.Mesh(wheelGeo, tireMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(...pos);
    w.castShadow = true;
    v.group.add(w);
    v.wheels.push(w);
  });

  v.group.position.set(v.x, 0, v.z);
  scene.add(v.group);
  return v;
}

// SPORTS BIKE
function createSportsBike(x, z) {
  const v = {
    type: 'bike',
    group: new THREE.Group(),
    x: x, z: z,
    speed: 0, maxSpeed: 44, accel: 34, friction: 7.0, angle: 0,
    radius: 1.0,
    box: { w: 0.9, d: 2.2 },
    wheels: [],
    sound: { bass: 55, bassR: 160, mid: 120, midR: 320 }
  };

  const bikePaint = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.85, roughness: 0.25 });
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.3 });

  const frame = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.65, 1.9), bikePaint);
  frame.position.y = 0.65;
  frame.castShadow = true;
  v.group.add(frame);

  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.12, 0.65), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
  seat.position.set(0, 0.86, -0.22);
  v.group.add(seat);

  const handle = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.12), frameMat);
  handle.position.set(0, 1.08, 0.55);
  v.group.add(handle);

  const bWheelGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.18, 16);
  const bTireMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85 });

  [[0, 0.36, 1.0], [0, 0.36, -0.9]].forEach(pos => {
    const w = new THREE.Mesh(bWheelGeo, bTireMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(...pos);
    w.castShadow = true;
    v.group.add(w);
    v.wheels.push(w);
  });

  v.group.position.set(v.x, 0, v.z);
  scene.add(v.group);
  return v;
}

// CITY BUS
function createCityBus(x, z) {
  const v = {
    type: 'bus',
    group: new THREE.Group(),
    x: x, z: z,
    speed: 0, maxSpeed: 25, accel: 15, friction: 9.0, angle: 0,
    radius: 2.2,
    box: { w: 2.8, d: 8.6 },
    wheels: [],
    sound: { bass: 22, bassR: 45, mid: 40, midR: 85 }
  };

  const busPaint = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 });
  const busWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });

  const lower = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.4, 8.4), busPaint);
  lower.position.y = 1.0;
  lower.castShadow = true;
  v.group.add(lower);

  const upper = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.2, 8.4), busWhite);
  upper.position.y = 2.2;
  upper.castShadow = true;
  v.group.add(upper);

  const busWheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
  const busTireMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });

  [[-1.25, 0.5, 2.6], [1.25, 0.5, 2.6], [-1.25, 0.5, -2.6], [1.25, 0.5, -2.6]].forEach(pos => {
    const w = new THREE.Mesh(busWheelGeo, busTireMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(...pos);
    w.castShadow = true;
    v.group.add(w);
    v.wheels.push(w);
  });

  v.group.position.set(v.x, 0, v.z);
  scene.add(v.group);
  return v;
}

vehicles.push(createSportsCar(-BLOCK_SIZE + 5.0, 14));
vehicles.push(createSportsBike(-BLOCK_SIZE - 5.0, 24));
vehicles.push(createCityBus(-BLOCK_SIZE + 6.0, -28));

// 6. SOLID COLLISION SYSTEM (STATIC OBJECTS + DYNAMIC VEHICLES)
function checkCollision(px, pz, radius = 0.5, excludeVehicle = null) {
  // Static Environment Colliders (Metro pillars & Buildings)
  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (px + radius > c.minX && px - radius < c.maxX && pz + radius > c.minZ && pz - radius < c.maxZ) {
      return true;
    }
  }

  // Solid Vehicle-to-Vehicle and Player-to-Vehicle Collisions
  for (let i = 0; i < vehicles.length; i++) {
    const v = vehicles[i];
    if (v === excludeVehicle) continue;

    // Oriented Bounding Box collision approximation
    const dist = Math.hypot(px - v.x, pz - v.z);
    if (dist < (radius + v.radius)) {
      return true; // Solid collision hit!
    }
  }

  return false;
}

// 7. INPUT & VEHICLE MOUNTING
const player = { x: -BLOCK_SIZE, y: 0, z: 8, vy: 0, angle: 0, radius: 0.5 };
let currentVehicle = null;
let yaw = 0, pitch = 0.25, joyX = 0, joyY = 0, running = false, drag = false, lx = 0, ly = 0;
let pedalGas = false, pedalBrake = false;
let lastTime = performance.now(), animTime = 0;
const lookTarget = new THREE.Vector3(0, 1.4, 0);

let camMode = 0;
camera.position.set(player.x, 3.2, player.z - 6.5);
camera.lookAt(player.x, 1.4, player.z);

const enterBtn = document.getElementById('enter-btn');
const runBtn = document.getElementById('run');
const jumpBtn = document.getElementById('jump');
const footButtons = document.getElementById('foot-buttons');
const vehiclePedals = document.getElementById('vehicle-pedals');
const accelBtn = document.getElementById('accel-btn');
const brakeBtn = document.getElementById('brake-btn');

document.getElementById('cam').addEventListener('pointerdown', () => camMode = (camMode + 1) % 3);

function toggleVehicle() {
  initAudio();
  playCarDoorFull();

  if (!currentVehicle) {
    let nearest = null;
    let minDist = 4.2;
    vehicles.forEach(v => {
      const dist = Math.hypot(player.x - v.x, player.z - v.z);
      if (dist < minDist) { minDist = dist; nearest = v; }
    });

    if (nearest) {
      currentVehicle = nearest;
      enterBtn.textContent = 'EXIT';
      footButtons.style.display = 'none';
      vehiclePedals.style.display = 'flex';
      yaw = currentVehicle.angle;

      if (currentVehicle.type === 'bike') {
        // PROPER REALISTIC BIKE SEATING POSITION
        playerGroup.visible = true;
        scene.remove(playerGroup);
        currentVehicle.group.add(playerGroup);

        // Position pelvis naturally on the bike seat
        playerGroup.position.set(0, 0.48, -0.22);
        playerGroup.rotation.set(0, 0, 0);

        pelvis.position.y = 0.52;
        torsoMesh.rotation.x = 0.28; // Lean chest towards handles

        // Hands firmly grabbing handlebars
        armL.rotation.set(-0.75, 0.22, -0.15);
        armR.rotation.set(-0.75, -0.22, 0.15);

        // Knees naturally bent onto footpegs
        legL.rotation.set(-1.15, 0.28, -0.1);
        legR.rotation.set(-1.15, -0.28, 0.1);
      } else {
        playerGroup.visible = false;
      }
    }
  } else {
    // EXIT VEHICLE SAFELY
    if (currentVehicle.type === 'bike') {
      currentVehicle.group.remove(playerGroup);
      scene.add(playerGroup);

      // Restore standing posture
      pelvis.position.y = 0.92;
      torsoMesh.rotation.x = 0;
      armL.rotation.set(0, 0, 0);
      armR.rotation.set(0, 0, 0);
      legL.rotation.set(0, 0, 0);
      legR.rotation.set(0, 0, 0);
    }

    player.x = currentVehicle.x - Math.cos(currentVehicle.angle) * (currentVehicle.radius + 1.2);
    player.z = currentVehicle.z + Math.sin(currentVehicle.angle) * (currentVehicle.radius + 1.2);
    player.y = 0;
    playerGroup.position.set(player.x, player.y, player.z);
    playerGroup.visible = true;

    currentVehicle = null;
    enterBtn.textContent = 'ENTER';
    footButtons.style.display = 'flex';
    vehiclePedals.style.display = 'none';
    pedalGas = false;
    pedalBrake = false;

    if (engineMaster) engineMaster.gain.setValueAtTime(0, audioCtx.currentTime);
  }
}

enterBtn.addEventListener('click', toggleVehicle);

accelBtn.addEventListener('pointerdown', () => pedalGas = true);
['pointerup', 'pointercancel', 'pointerleave'].forEach(e => accelBtn.addEventListener(e, () => pedalGas = false));

brakeBtn.addEventListener('pointerdown', () => pedalBrake = true);
['pointerup', 'pointercancel', 'pointerleave'].forEach(e => brakeBtn.addEventListener(e, () => pedalBrake = false));

// 8. SIMULATION LOOP
function update(dt) {
  animTime += dt;

  // Metro Train Loop
  metroTrain.position.z += trainSpeed * dt;
  if (metroTrain.position.z > 350) { metroTrain.position.z = 350; trainSpeed = -26.0; }
  else if (metroTrain.position.z < -350) { metroTrain.position.z = -350; trainSpeed = 26.0; }

  let ix = joyX, iz = joyY;
  const k = window.keys || {};
  if (k.w || k.arrowup) iz = -1;
  if (k.s || k.arrowdown) iz = 1;
  if (k.a || k.arrowleft) ix = -1;
  if (k.d || k.arrowright) ix = 1;

  if (k.f) { toggleVehicle(); k.f = false; }

  // Check Nearby Vehicle
  if (!currentVehicle) {
    let canEnter = false;
    vehicles.forEach(v => {
      if (Math.hypot(player.x - v.x, player.z - v.z) < 4.2) canEnter = true;
    });
    enterBtn.style.display = canEnter ? 'block' : 'none';
  } else {
    enterBtn.style.display = 'block';
  }

  if (currentVehicle) {
    const cv = currentVehicle;
    let throttle = 0;
    if (pedalGas || k.w || k.arrowup) throttle += 1;
    if (pedalBrake || k.s || k.arrowdown) throttle -= 1;

    const steer = ix;

    if (throttle > 0) {
      cv.speed = Math.min(cv.maxSpeed, cv.speed + cv.accel * dt);
    } else if (throttle < 0) {
      if (cv.speed > 0.5) cv.speed = Math.max(0, cv.speed - cv.accel * 1.6 * dt);
      else cv.speed = Math.max(-cv.maxSpeed * 0.45, cv.speed - cv.accel * 0.6 * dt);
    } else {
      if (cv.speed > 0) cv.speed = Math.max(0, cv.speed - cv.friction * dt);
      if (cv.speed < 0) cv.speed = Math.min(0, cv.speed + cv.friction * dt);
    }

    // Engine Audio
    if (oscBass && oscMid && engineMaster) {
      const speedRatio = Math.abs(cv.speed) / cv.maxSpeed;
      oscBass.frequency.setValueAtTime(cv.sound.bass + speedRatio * cv.sound.bassR + (throttle > 0 ? 25 : 0), audioCtx.currentTime);
      oscMid.frequency.setValueAtTime(cv.sound.mid + speedRatio * cv.sound.midR + (throttle > 0 ? 45 : 0), audioCtx.currentTime);
      engineMaster.gain.setValueAtTime(0.24 + speedRatio * 0.16 + (throttle !== 0 ? 0.08 : 0), audioCtx.currentTime);
    }

    // Steering
    if (Math.abs(cv.speed) > 0.1) {
      const dir = cv.speed > 0 ? 1 : -1;
      const turnRate = cv.type === 'bike' ? 2.6 : (cv.type === 'bus' ? 1.4 : 2.0);
      cv.angle -= steer * turnRate * dir * dt;

      // Realistic Bike Banking (Lean into turns)
      if (cv.type === 'bike') {
        cv.group.rotation.z = -steer * 0.38 * Math.min(1, Math.abs(cv.speed) / 12);
      }

      if (!drag && camMode !== 2) {
        let angleDiff = cv.angle - yaw;
        angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
        yaw += angleDiff * Math.min(1, dt * 3.0);
      }
    } else {
      if (cv.type === 'bike') cv.group.rotation.z = 0;
    }

    // Wheel Roll
    const roll = (cv.speed * dt) / 0.38;
    cv.wheels.forEach(w => w.rotation.x += roll);

    const vx = Math.sin(cv.angle) * cv.speed * dt;
    const vz = Math.cos(cv.angle) * cv.speed * dt;

    // Solid Non-Ghost Collision check on both axes
    if (!checkCollision(cv.x + vx, cv.z, cv.radius, cv)) {
      cv.x += vx;
    } else {
      cv.speed = 0; // Solid stop
    }

    if (!checkCollision(cv.x, cv.z + vz, cv.radius, cv)) {
      cv.z += vz;
    } else {
      cv.speed = 0;
    }

    cv.group.position.set(cv.x, 0, cv.z);
    cv.group.rotation.y = cv.angle;

    // Camera follow
    let targetCamX, targetCamY, targetCamZ;
    const baseDist = cv.type === 'bus' ? 14.5 : (cv.type === 'bike' ? 6.5 : 8.5);
    const baseHeight = cv.type === 'bus' ? 3.8 : (cv.type === 'bike' ? 1.8 : 2.0);

    if (camMode === 0) {
      const d = baseDist + (Math.abs(cv.speed) / cv.maxSpeed) * 1.8;
      targetCamX = cv.x - Math.sin(yaw) * Math.cos(pitch) * d;
      targetCamZ = cv.z - Math.cos(yaw) * Math.cos(pitch) * d;
      targetCamY = Math.max(0.8, baseHeight + Math.sin(pitch) * d);
    } else {
      targetCamX = cv.x - Math.sin(yaw) * Math.cos(pitch) * (baseDist + 5);
      targetCamZ = cv.z - Math.cos(yaw) * Math.cos(pitch) * (baseDist + 5);
      targetCamY = Math.max(1.2, baseHeight + 2.0 + Math.sin(pitch) * d);
    }

    camera.position.x += (targetCamX - camera.position.x) * 0.15;
    camera.position.y += (targetCamY - camera.position.y) * 0.15;
    camera.position.z += (targetCamZ - camera.position.z) * 0.15;

    lookTarget.x += (cv.x - lookTarget.x) * 0.15;
    lookTarget.y += (1.4 - lookTarget.y) * 0.15;
    lookTarget.z += (cv.z - lookTarget.z) * 0.15;
    camera.lookAt(lookTarget);

  } else {
    // ON FOOT WALKING WITH SOLID HITBOX
    const len = Math.hypot(ix, iz);
    if (len > 1) { ix /= len; iz /= len; }
    const isMoving = len > 0.05;
    const isRunning = running || k.shift;
    const speed = isRunning ? 9.5 : 4.5;

    if (isMoving) {
      const dx = (-iz * Math.sin(yaw) - ix * Math.cos(yaw)) * speed * dt;
      const dz = (-iz * Math.cos(yaw) + ix * Math.sin(yaw)) * speed * dt;

      // Solid Player Collision with Vehicles and Buildings
      if (!checkCollision(player.x + dx, player.z, player.radius)) player.x += dx;
      if (!checkCollision(player.x, player.z + dz, player.radius)) player.z += dz;

      player.angle = Math.atan2(dx, dz);

      const swingSpeed = isRunning ? 16 : 9;
      const swing = Math.sin(animTime * swingSpeed) * (isRunning ? 0.8 : 0.45);
      legL.rotation.x = swing;
      legR.rotation.x = -swing;
      armL.rotation.x = -swing * 0.9;
      armR.rotation.x = swing * 0.9;

      if (animTime - lastStepTime > (isRunning ? 0.28 : 0.44)) {
        playFootstep();
        lastStepTime = animTime;
      }
    } else {
      legL.rotation.x = 0; legR.rotation.x = 0;
      armL.rotation.x = 0; armR.rotation.x = 0;
    }

    player.vy -= 22 * dt;
    player.y += player.vy * dt;
    if (player.y <= 0) { player.y = 0; player.vy = 0; }

    playerGroup.position.set(player.x, player.y, player.z);
    playerGroup.rotation.y = player.angle;

    const d = 6.0;
    const targetCamX = player.x - Math.sin(yaw) * Math.cos(pitch) * d;
    const targetCamZ = player.z - Math.cos(yaw) * Math.cos(pitch) * d;
    const targetCamY = Math.max(0.6, player.y + 1.6 + Math.sin(pitch) * d);

    camera.position.x += (targetCamX - camera.position.x) * 0.15;
    camera.position.y += (targetCamY - camera.position.y) * 0.15;
    camera.position.z += (targetCamZ - camera.position.z) * 0.15;

    lookTarget.x += (player.x - lookTarget.x) * 0.15;
    lookTarget.y += ((player.y + 1.35) - lookTarget.y) * 0.15;
    lookTarget.z += (player.z - lookTarget.z) * 0.15;
    camera.lookAt(lookTarget);
  }
}

// 9. EVENT LISTENERS
window.keys = {};
addEventListener('keydown', e => window.keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => window.keys[e.key.toLowerCase()] = false);

const joy = document.getElementById('joy'), stick = document.getElementById('stick');
let joyActive = false;
function joySet(e) {
  const r = joy.getBoundingClientRect();
  let x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
  const max = 45, l = Math.hypot(x, y);
  if (l > max) { x = x * max / l; y = y * max / l; }
  joyX = x / max; joyY = y / max;
  stick.style.transform = `translate(${x}px, ${y}px)`;
}
joy.addEventListener('pointerdown', e => { joyActive = true; joy.setPointerCapture(e.pointerId); joySet(e); });
joy.addEventListener('pointermove', e => { if (joyActive) joySet(e); });
['pointerup', 'pointercancel'].forEach(t => joy.addEventListener(t, () => {
  joyActive = false; joyX = 0; joyY = 0; stick.style.transform = 'translate(0, 0)';
}));

const look = document.getElementById('look');
look.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; look.setPointerCapture(e.pointerId); });
look.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  yaw -= dx * 0.0055;
  pitch = Math.max(-0.15, Math.min(1.15, pitch + dy * 0.005));
});
['pointerup', 'pointercancel'].forEach(t => look.addEventListener(t, () => drag = false));

runBtn.addEventListener('pointerdown', () => running = true);
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => runBtn.addEventListener(t, () => running = false));

jumpBtn.addEventListener('pointerdown', () => {
  if (!currentVehicle && player.y <= 0.02) player.vy = 7.5;
});

function resize() {
  const w = window.innerWidth || document.documentElement.clientWidth || 360;
  const h = window.innerHeight || document.documentElement.clientHeight || 640;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

function loop(now) {
  const dt = Math.min(0.04, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
