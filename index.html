<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kochi 3D - Clean Asphalt & Seawall Beach</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78b9df;font-family:Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none}
.top{position:absolute;left:14px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);padding:8px 12px;border-radius:8px;font-weight:800;border:1px solid rgba(255,255,255,0.2)}

/* Radar Minimap */
#minimap-container{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,0.9);background:#111822;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center}
#minimap{width:120px;height:120px;display:block}

.joy{position:absolute;left:20px;bottom:24px;width:140px;height:140px;border:2px solid rgba(255,255,255,0.4);border-radius:50%;background:rgba(0,0,0,0.25);pointer-events:auto}
.stick{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:rgba(255,255,255,0.4);border:2px solid rgba(255,255,255,0.8)}
#look{position:absolute;left:170px;right:0;top:80px;bottom:0;pointer-events:auto}
.cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:2px solid #fff;border-radius:50%;opacity:0.8}

.buttons{position:absolute;right:16px;bottom:20px;display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.btn{min-width:62px;height:58px;border:2px solid rgba(255,255,255,0.5);border-radius:29px;background:rgba(0,0,0,0.65);color:#fff;font-weight:800;cursor:pointer}
.btn:active{background:rgba(255,255,255,0.3)}

#enter-btn{background:#eab308;color:#000;display:none}

.pedal-box{display:none;gap:12px;align-items:flex-end}
.btn-pedal{width:64px;height:84px;border-radius:14px;border:2px solid rgba(255,255,255,0.6);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#accel-btn{background:rgba(34,197,94,0.75)}
#accel-btn:active{background:rgba(34,197,94,1)}
#brake-btn{background:rgba(239,68,68,0.75)}
#brake-btn:active{background:rgba(239,68,68,1)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="top">
    <div id="minimap-container">
      <canvas id="minimap" width="120" height="120"></canvas>
    </div>
    <div class="pill">HP: <span id="hp">100</span></div>
    <div class="pill">₹ 25,000</div>
    <div class="pill" id="loc-indicator">KOCHI - MARINE DRIVE</div>
    <div class="pill" id="cam-indicator">CAM: NORMAL</div>
  </div>
  <div id="look"><div class="cross"></div></div>
  <div class="joy" id="joy"><div class="stick" id="stick"></div></div>
  <div class="buttons">
    <button class="btn" id="enter-btn">ENTER</button>

    <div id="foot-buttons" style="display:flex;gap:10px;">
      <button class="btn" id="run">RUN</button>
      <button class="btn" id="jump">JUMP</button>
    </div>

    <div id="vehicle-pedals" class="pedal-box">
      <div class="btn-pedal" id="brake-btn">BRAKE<br>REV</div>
      <div class="btn-pedal" id="accel-btn">GAS</div>
    </div>

    <button class="btn" id="cam">CAM</button>
  </div>
</div>

<script>
'use strict';

// ==========================================
// AUDIO SYNTHESIZER
// ==========================================
let audioCtx = null;
let oscBass = null, oscMid = null;
let engineMaster = null;
let brakeNoiseNode = null, brakeGain = null;
let lastStepTime = 0;

function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();

  engineMaster = audioCtx.createGain();
  engineMaster.gain.setValueAtTime(0, audioCtx.currentTime);
  engineMaster.connect(audioCtx.destination);

  oscBass = audioCtx.createOscillator();
  oscBass.type = 'sawtooth';
  oscBass.frequency.setValueAtTime(32, audioCtx.currentTime);

  const bassFilter = audioCtx.createBiquadFilter();
  bassFilter.type = 'lowpass';
  bassFilter.frequency.setValueAtTime(140, audioCtx.currentTime);
  oscBass.connect(bassFilter);
  bassFilter.connect(engineMaster);
  oscBass.start();

  oscMid = audioCtx.createOscillator();
  oscMid.type = 'triangle';
  oscMid.frequency.setValueAtTime(64, audioCtx.currentTime);

  const midFilter = audioCtx.createBiquadFilter();
  midFilter.type = 'bandpass';
  midFilter.frequency.setValueAtTime(260, audioCtx.currentTime);
  midFilter.Q.setValueAtTime(2.0, audioCtx.currentTime);
  oscMid.connect(midFilter);
  midFilter.connect(engineMaster);
  oscMid.start();

  const bufferSize = audioCtx.sampleRate * 2;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

  brakeNoiseNode = audioCtx.createBufferSource();
  brakeNoiseNode.buffer = noiseBuffer;
  brakeNoiseNode.loop = true;

  const brakeFilter = audioCtx.createBiquadFilter();
  brakeFilter.type = 'bandpass';
  brakeFilter.frequency.setValueAtTime(800, audioCtx.currentTime);
  brakeFilter.Q.setValueAtTime(3.0, audioCtx.currentTime);

  brakeGain = audioCtx.createGain();
  brakeGain.gain.setValueAtTime(0, audioCtx.currentTime);

  brakeNoiseNode.connect(brakeFilter);
  brakeFilter.connect(brakeGain);
  brakeGain.connect(audioCtx.destination);
  brakeNoiseNode.start();
}

function playCarDoorFull() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;

  const clickOsc = audioCtx.createOscillator();
  const clickGain = audioCtx.createGain();
  clickOsc.type = 'triangle';
  clickOsc.frequency.setValueAtTime(850, t);
  clickOsc.frequency.exponentialRampToValueAtTime(120, t + 0.05);

  clickGain.gain.setValueAtTime(0.35, t);
  clickGain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);

  clickOsc.connect(clickGain);
  clickGain.connect(audioCtx.destination);
  clickOsc.start(t);
  clickOsc.stop(t + 0.05);

  const slamT = t + 0.14;
  const slamOsc = audioCtx.createOscillator();
  const slamGain = audioCtx.createGain();

  slamOsc.type = 'sawtooth';
  slamOsc.frequency.setValueAtTime(140, slamT);
  slamOsc.frequency.exponentialRampToValueAtTime(25, slamT + 0.22);

  const slamFilter = audioCtx.createBiquadFilter();
  slamFilter.type = 'lowpass';
  slamFilter.frequency.setValueAtTime(220, slamT);

  slamGain.gain.setValueAtTime(0.7, slamT);
  slamGain.gain.exponentialRampToValueAtTime(0.001, slamT + 0.22);

  slamOsc.connect(slamFilter);
  slamFilter.connect(slamGain);
  slamGain.connect(audioCtx.destination);

  slamOsc.start(slamT);
  slamOsc.stop(slamT + 0.22);
}

function playFootstep() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.06);

  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.06);
}

window.addEventListener('pointerdown', () => {
  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false });

const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7fc0ec);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 800);

// Sunlight
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d6642, 0.85);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xfffaed, 1.15);
dirLight.position.set(100, 160, 80);
dirLight.castShadow = true;
scene.add(dirLight);

// ==========================================
// URBAN KOCHI MAP & SEAWALL BEACH
// ==========================================
const BLOCK_SIZE = 70; 
const ROAD_WIDTH = 14; 
const HALF_ROAD = ROAD_WIDTH / 2;
const SIDEWALK_W = 2.4; 
const GRID_MIN = -2; 
const GRID_MAX = 3;  
const colliders = [];

// Base Ground (Kerala Green Lawn)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(900, 900),
  new THREE.MeshStandardMaterial({ color: 0x2e6630, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 1. Animated Ocean Water (Waves)
const waterGeo = new THREE.PlaneGeometry(280, 900, 16, 16);
const waterMat = new THREE.MeshStandardMaterial({ 
  color: 0x0c4a6e, 
  roughness: 0.12, 
  metalness: 0.8,
  transparent: true,
  opacity: 0.95
});
const ocean = new THREE.Mesh(waterGeo, waterMat);
ocean.rotation.x = -Math.PI / 2;
ocean.position.set(-220, 0.2, 0);
scene.add(ocean);

// 2. Compact Realistic Beach Strip
const beach = new THREE.Mesh(
  new THREE.PlaneGeometry(28, 900),
  new THREE.MeshStandardMaterial({ color: 0xc89d66, roughness: 0.95 })
);
beach.rotation.x = -Math.PI / 2;
beach.position.set(-66, 0.08, 0);
beach.receiveShadow = true;
scene.add(beach);

// 3. Realistic Rock Seawall
const rockMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 });
for (let bz = -350; bz <= 350; bz += 5) {
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.2, 0), rockMat);
  rock.scale.set(1.4, 0.8, 1.6);
  rock.rotation.set((bz % 3) * 0.4, (bz % 5) * 0.3, 0);
  rock.position.set(-79, 0.55, bz);
  scene.add(rock);
}

// 4. Clean Roads
const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1e23, roughness: 0.92 });
const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x78828c, roughness: 0.8 });
const whiteDashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

const roadCoords = [];
for (let i = GRID_MIN; i <= GRID_MAX; i++) {
  roadCoords.push(i * BLOCK_SIZE);
}

const TOTAL_SPAN = (GRID_MAX - GRID_MIN) * BLOCK_SIZE + 90;
const CENTER_OFFSET = ((GRID_MAX + GRID_MIN) * BLOCK_SIZE) / 2;

// North-South Roads
roadCoords.forEach(rx => {
  const rZ = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, TOTAL_SPAN), roadMat);
  rZ.rotation.x = -Math.PI / 2;
  rZ.position.set(rx, 0.02, CENTER_OFFSET);
  rZ.receiveShadow = true;
  scene.add(rZ);

  [-1, 1].forEach(side => {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(SIDEWALK_W, 0.14, TOTAL_SPAN), sidewalkMat);
    sw.position.set(rx + side * (HALF_ROAD + SIDEWALK_W / 2), 0.07, CENTER_OFFSET);
    sw.receiveShadow = true;
    scene.add(sw);
  });

  for (let z = -250; z <= 300; z += 14) {
    let nearCross = false;
    roadCoords.forEach(cz => {
      if (Math.abs(z - cz) < HALF_ROAD + 2) nearCross = true;
    });
    if (nearCross) continue;

    const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 5.0), whiteDashMat);
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(rx, 0.03, z);
    scene.add(dash);
  }
});

// East-West Roads
roadCoords.forEach(rz => {
  const rX = new THREE.Mesh(new THREE.PlaneGeometry(TOTAL_SPAN, ROAD_WIDTH), roadMat);
  rX.rotation.x = -Math.PI / 2;
  rX.position.set(CENTER_OFFSET, 0.022, rz);
  rX.receiveShadow = true;
  scene.add(rX);

  [-1, 1].forEach(side => {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(TOTAL_SPAN, 0.14, SIDEWALK_W), sidewalkMat);
    sw.position.set(CENTER_OFFSET, 0.07, rz + side * (HALF_ROAD + SIDEWALK_W / 2));
    sw.receiveShadow = true;
    scene.add(sw);
  });

  for (let x = -250; z <= 300; x += 14) {
    let nearCross = false;
    roadCoords.forEach(cx => {
      if (Math.abs(x - cx) < HALF_ROAD + 2) nearCross = true;
    });
    if (nearCross) continue;

    const dash = new THREE.Mesh(new THREE.PlaneGeometry(5.0, 0.35), whiteDashMat);
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(x, 0.032, rz);
    scene.add(dash);
  }
});

// Kochi Metro Viaduct along Main MG Road
const pillarMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.8 });
const trackMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, metalness: 0.5, roughness: 0.35 });

for (let pz = -220; pz <= 280; pz += 30) {
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.75, 7.2, 12), pillarMat);
  pillar.position.set(0, 3.6, pz);
  pillar.castShadow = true;
  scene.add(pillar);

  colliders.push({
    minX: -0.9, maxX: 0.9,
    minZ: pz - 0.9, maxZ: pz + 0.9,
    w: 1.8, d: 1.8, px: 0, pz: pz
  });
}

const metroTrack = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.65, TOTAL_SPAN), trackMat);
metroTrack.position.set(0, 7.4, CENTER_OFFSET);
metroTrack.castShadow = true;
scene.add(metroTrack);

// Metro Train
const metroTrain = new THREE.Group();
const coachBodyMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.3 });
const coachStripeMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.4 });
const coachGlassMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.1 });

for (let c = -1; c <= 1; c++) {
  const coach = new THREE.Group();
  const cBody = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.5, 12), coachBodyMat);
  cBody.position.y = 1.25;
  coach.add(cBody);

  const cStripe = new THREE.Mesh(new THREE.BoxGeometry(2.85, 0.45, 12.02), coachStripeMat);
  cStripe.position.y = 1.15;
  coach.add(cStripe);

  const cGlass = new THREE.Mesh(new THREE.BoxGeometry(2.86, 0.8, 10.5), coachGlassMat);
  cGlass.position.y = 1.7;
  coach.add(cGlass);

  coach.position.z = c * 13.2;
  metroTrain.add(coach);
}
metroTrain.position.set(0, 7.7, 0);
scene.add(metroTrain);
let trainSpeed = 22.0;

// Trees
const palmTrunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3e27, roughness: 0.9 });
const palmLeafMat = new THREE.MeshStandardMaterial({ color: 0x1d6a2a, roughness: 0.6 });
const treeLeafMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.7 });

function addPalmTree(x, z) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 6.2, 8), palmTrunkMat);
  trunk.position.y = 3.1;
  trunk.castShadow = true;
  tree.add(trunk);

  const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.9, 8, 6), palmLeafMat);
  leaves.scale.set(1.5, 0.35, 1.5);
  leaves.position.y = 5.9;
  leaves.castShadow = true;
  tree.add(leaves);

  tree.position.set(x, 0, z);
  scene.add(tree);
}

function addGardenTree(x, z) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 3.5, 8), palmTrunkMat);
  trunk.position.y = 1.75;
  tree.add(trunk);

  const dome = new THREE.Mesh(new THREE.DodecahedronGeometry(2.6, 1), treeLeafMat);
  dome.position.y = 4.8;
  dome.castShadow = true;
  tree.add(dome);

  tree.position.set(x, 0, z);
  scene.add(tree);
}

for (let z = -280; z <= 300; z += 24) {
  addPalmTree(-50, z);
}

// Dynamic Billboards
function createBillboard(text, subtitle, bgColor = '#0f172a', textColor = '#facc15') {
  const bCanvas = document.createElement('canvas');
  bCanvas.width = 512;
  bCanvas.height = 160;
  const ctx = bCanvas.getContext('2d');

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, 512, 160);

  ctx.lineWidth = 8;
  ctx.strokeStyle = textColor;
  ctx.strokeRect(6, 6, 500, 148);

  ctx.font = 'bold 44px Arial, sans-serif';
  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.fillText(text, 256, 75);

  if (subtitle) {
    ctx.font = '600 24px Arial, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(subtitle, 256, 120);
  }

  const texture = new THREE.CanvasTexture(bCanvas);
  const mat = new THREE.MeshBasicMaterial({ map: texture });
  return new THREE.Mesh(new THREE.PlaneGeometry(9.0, 2.8), mat);
}

const kochiLandmarks = [
  { name: 'PENTA MENAKA', sub: 'MOBILES & ACCESSORIES', color: '#06b6d4' },
  { name: 'LULU MALL', sub: 'EDAPPALLY, KOCHI', color: '#e11d48' },
  { name: 'CENTRE SQUARE', sub: 'MG ROAD MALL & CINEMA', color: '#3b82f6' },
  { name: 'PARAGON HOTEL', sub: 'MALABAR CUISINE', color: '#16a34a' },
  { name: 'AL TAZA', sub: 'FAMOUS SHAWARMA', color: '#ea580c' },
  { name: 'GRAND HOTEL', sub: 'SEAFOOD RESTAURANT', color: '#eab308' },
  { name: 'MILMA MILK BOOTH', sub: 'TEA & SNACKS', color: '#38bdf8' }
];

let bldgIdx = 0;
const bldgMatA = new THREE.MeshStandardMaterial({ color: 0x0f2b48, metalness: 0.8, roughness: 0.2 });
const bldgMatB = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.7 });
const bldgMatC = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.6 });

for (let bx = GRID_MIN; bx < GRID_MAX; bx++) {
  for (let bz = GRID_MIN; bz < GRID_MAX; bz++) {
    const lotCenterX = bx * BLOCK_SIZE + BLOCK_SIZE / 2;
    const lotCenterZ = bz * BLOCK_SIZE + BLOCK_SIZE / 2;

    const plotPatch = new THREE.Mesh(
      new THREE.PlaneGeometry(BLOCK_SIZE - ROAD_WIDTH - 2, BLOCK_SIZE - ROAD_WIDTH - 2),
      new THREE.MeshStandardMaterial({ color: 0x225526, roughness: 0.85 })
    );
    plotPatch.rotation.x = -Math.PI / 2;
    plotPatch.position.set(lotCenterX, 0.03, lotCenterZ);
    scene.add(plotPatch);

    if ((bx + bz) % 3 === 0) {
      addGardenTree(lotCenterX - 10, lotCenterZ - 10);
      addGardenTree(lotCenterX + 10, lotCenterZ + 10);
      addPalmTree(lotCenterX + 10, lotCenterZ - 10);
      addPalmTree(lotCenterX - 10, lotCenterZ + 10);
      continue;
    }

    const bw = 24, bd = 24;
    const bh = 18 + ((Math.abs(bx * 7 + bz * 13)) % 16);
    const bMat = (bx % 2 === 0) ? bldgMatA : (bz % 2 === 0 ? bldgMatB : bldgMatC);

    const bGroup = new THREE.Group();
    const bMesh = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), bMat);
    bMesh.position.y = bh / 2;
    bMesh.castShadow = true;
    bMesh.receiveShadow = true;
    bGroup.add(bMesh);

    if (bldgIdx < kochiLandmarks.length) {
      const lm = kochiLandmarks[bldgIdx++];
      const board = createBillboard(lm.name, lm.sub, '#020617', lm.color);
      board.position.set(0, bh - 2.0, bd / 2 + 0.15);
      bGroup.add(board);
    }

    addPalmTree(lotCenterX - 18, lotCenterZ - 18);
    addPalmTree(lotCenterX + 18, lotCenterZ + 18);

    bGroup.position.set(lotCenterX, 0, lotCenterZ);
    scene.add(bGroup);

    colliders.push({
      minX: lotCenterX - bw / 2, maxX: lotCenterX + bw / 2,
      minZ: lotCenterZ - bd / 2, maxZ: lotCenterZ + bd / 2,
      w: bw, d: bd, px: lotCenterX, pz: lotCenterZ
    });
  }
}

colliders.push({
  minX: -400, maxX: -82,
  minZ: -450, maxZ: 450,
  w: 318, d: 900, px: -241, pz: 0
});

// Skid Marks
const skidSegments = [];
let prevLeftWheel = null;
let prevRightWheel = null;

function addSkidRibbon(p1, p2) {
  const dist = Math.hypot(p2.x - p1.x, p2.z - p1.z);
  if (dist < 0.1) return;

  const midX = (p1.x + p2.x) / 2;
  const midZ = (p1.z + p2.z) / 2;
  const angle = Math.atan2(p2.x - p1.x, p2.z - p1.z);

  const geo = new THREE.PlaneGeometry(0.34, dist);
  const mat = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.65, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat);

  mesh.rotation.x = -Math.PI / 2;
  mesh.rotation.z = -angle;
  mesh.position.set(midX, 0.035, midZ);

  scene.add(mesh);
  skidSegments.push({ mesh, life: 5.5 });
}

function updateSkidMarks(dt) {
  for (let i = skidSegments.length - 1; i >= 0; i--) {
    const s = skidSegments[i];
    s.life -= dt;
    if (s.life < 1.5) s.mesh.material.opacity = Math.max(0, s.life / 1.5) * 0.65;
    if (s.life <= 0) {
      scene.remove(s.mesh);
      s.mesh.geometry.dispose();
      s.mesh.material.dispose();
      skidSegments.splice(i, 1);
    }
  }
}

function checkCollision(px, pz) {
  const r = inCar ? 1.3 : player.radius;
  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (
      px + r > c.minX &&
      px - r < c.maxX &&
      pz + r > c.minZ &&
      pz - r < c.maxZ
    ) {
      return true;
    }
  }
  return false;
}

const MAP_ZOOM = 0.38; 

function renderRotatingMinimap() {
  const activeX = inCar ? car.x : player.x;
  const activeZ = inCar ? car.z : player.z;
  const activeAngle = inCar ? car.angle : player.angle;

  mCtx.clearRect(0, 0, 120, 120);

  mCtx.fillStyle = '#225227';
  mCtx.fillRect(0, 0, 120, 120);

  mCtx.save();
  mCtx.translate(60, 60);
  mCtx.rotate(activeAngle);

  // Ocean
  mCtx.fillStyle = '#0c4a6e';
  mCtx.fillRect((-220 - activeX) * MAP_ZOOM - (140 * MAP_ZOOM), -(-450 - activeZ) * MAP_ZOOM, 280 * MAP_ZOOM, -900 * MAP_ZOOM);

  // Beach
  mCtx.fillStyle = '#c89d66';
  mCtx.fillRect((-66 - activeX) * MAP_ZOOM - (14 * MAP_ZOOM), -(-450 - activeZ) * MAP_ZOOM, 28 * MAP_ZOOM, -900 * MAP_ZOOM);

  // Roads
  mCtx.fillStyle = '#1a1e23';
  roadCoords.forEach(rx => {
    mCtx.fillRect((rx - activeX) * MAP_ZOOM - (ROAD_WIDTH * MAP_ZOOM) / 2, -(-400 - activeZ) * MAP_ZOOM, ROAD_WIDTH * MAP_ZOOM, -TOTAL_SPAN * MAP_ZOOM);
  });
  roadCoords.forEach(rz => {
    mCtx.fillRect((-300 - activeX) * MAP_ZOOM, -(rz - activeZ) * MAP_ZOOM - (ROAD_WIDTH * MAP_ZOOM) / 2, TOTAL_SPAN * MAP_ZOOM, ROAD_WIDTH * MAP_ZOOM);
  });

  // Metro Track
  mCtx.fillStyle = '#2563eb';
  mCtx.fillRect((0 - activeX) * MAP_ZOOM - 1.5, -(-400 - activeZ) * MAP_ZOOM, 3, -TOTAL_SPAN * MAP_ZOOM);

  // Metro Train
  mCtx.fillStyle = '#06b6d4';
  mCtx.fillRect((metroTrain.position.x - activeX) * MAP_ZOOM - 2.5, -(metroTrain.position.z - activeZ) * MAP_ZOOM - 12, 5, 24);

  // Buildings
  mCtx.fillStyle = '#475569';
  colliders.forEach(c => {
    if (c.w > 40) return;
    const bx = (c.px - activeX) * MAP_ZOOM;
    const bz = -(c.pz - activeZ) * MAP_ZOOM;
    mCtx.fillRect(bx - (c.w * MAP_ZOOM) / 2, bz - (c.d * MAP_ZOOM) / 2, c.w * MAP_ZOOM, c.d * MAP_ZOOM);
  });

  // Car Blip
  if (!inCar) {
    const cx = (car.x - activeX) * MAP_ZOOM;
    const cz = -(car.z - activeZ) * MAP_ZOOM;
    mCtx.fillStyle = '#38bdf8';
    mCtx.beginPath();
    mCtx.arc(cx, cz, 4.5, 0, Math.PI * 2);
    mCtx.fill();
    mCtx.strokeStyle = '#ffffff';
    mCtx.lineWidth = 1.5;
    mCtx.stroke();
  }

  mCtx.restore();

  // Center Player Arrow
  mCtx.save();
  mCtx.translate(60, 60);
  mCtx.fillStyle = inCar ? '#ef4444' : '#facc15';
  mCtx.strokeStyle = '#000000';
  mCtx.lineWidth = 2;

  mCtx.beginPath();
  mCtx.moveTo(0, -11);
  mCtx.lineTo(7, 7);
  mCtx.lineTo(0, 3);
  mCtx.lineTo(-7, 7);
  mCtx.closePath();
  mCtx.fill();
  mCtx.stroke();

  mCtx.restore();
}

function update(dt) {
  animTime += dt;
  updateSkidMarks(dt);

  ocean.position.y = 0.2 + Math.sin(animTime * 2.5) * 0.08;

  metroTrain.position.z += trainSpeed * dt;
  if (metroTrain.position.z > 240) {
    metroTrain.position.z = 240;
    trainSpeed = -22.0;
  } else if (metroTrain.position.z < -240) {
    metroTrain.position.z = -240;
    trainSpeed = 22.0;
  }

  let ix = joyX, iz = joyY;
  const k = window.keys || {};
  if (k.w || k.arrowup) iz = -1;
  if (k.s || k.arrowdown) iz = 1;
  if (k.a || k.arrowleft) ix = -1;
  if (k.d || k.arrowright) ix = 1;

  if (k.f) {
    toggleVehicle();
    k.f = false;
  }
  if (k.v) {
    cycleCameraMode();
    k.v = false;
  }

  const distToCar = Math.hypot(player.x - car.x, player.z - car.z);
  enterBtn.style.display = (!inCar && distToCar < 3.8) || inCar ? 'block' : 'none';

  if (inCar) {
    let throttle = 0;
    if (pedalGas || k.w || k.arrowup) throttle += 1;
    if (pedalBrake || k.s || k.arrowdown) throttle -= 1;

    const steer = ix;

    if (throttle < 0) {
      brakeLightMat.color.setHex(0xff1111);
      brakeLightMat.emissive.setHex(0xff0000);
    } else {
      brakeLightMat.color.setHex(0x440000);
      brakeLightMat.emissive.setHex(0x220000);
    }

    if (throttle > 0) {
      car.speed += car.accel * dt;
      car.speed = Math.min(car.maxSpeed, car.speed);
    } else if (throttle < 0) {
      if (car.speed > 0.5) {
        car.speed = Math.max(0, car.speed - car.accel * 1.6 * dt);
      } else {
        car.speed -= car.accel * 0.6 * dt;
        car.speed = Math.max(-car.maxSpeed * 0.45, car.speed);
      }
    } else {
      if (car.speed > 0) car.speed = Math.max(0, car.speed - car.friction * dt);
      if (car.speed < 0) car.speed = Math.min(0, car.speed + car.friction * dt);
    }

    if (oscBass && oscMid && engineMaster) {
      const speedRatio = Math.abs(car.speed) / car.maxSpeed;
      const targetBass = 30 + speedRatio * 85 + (throttle > 0 ? 25 : 0);
      const targetMid = 60 + speedRatio * 180 + (throttle > 0 ? 45 : 0);

      oscBass.frequency.setValueAtTime(targetBass, audioCtx.currentTime);
      oscMid.frequency.setValueAtTime(targetMid, audioCtx.currentTime);
      engineMaster.gain.setValueAtTime(0.24 + speedRatio * 0.16 + (throttle !== 0 ? 0.08 : 0), audioCtx.currentTime);
    }

    const isHardBraking = (throttle < 0) && (car.speed > 10);

    if (brakeGain) {
      if (isHardBraking) {
        brakeGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      } else {
        brakeGain.gain.setValueAtTime(0, audioCtx.currentTime);
      }
    }

    const cosA = Math.cos(car.angle), sinA = Math.sin(car.angle);
    const curLeft = {
      x: car.x - 0.95 * cosA - 1.3 * sinA,
      z: car.z + 0.95 * sinA - 1.3 * cosA
    };
    const curRight = {
      x: car.x + 0.95 * cosA - 1.3 * sinA,
      z: car.z - 0.95 * sinA - 1.3 * cosA
    };

    if (isHardBraking) {
      if (prevLeftWheel && prevRightWheel) {
        addSkidRibbon(prevLeftWheel, curLeft);
        addSkidRibbon(prevRightWheel, curRight);
      }
      prevLeftWheel = curLeft;
      prevRightWheel = curRight;
    } else {
      prevLeftWheel = null;
      prevRightWheel = null;
    }

    if (Math.abs(car.speed) > 0.1) {
      const dir = car.speed > 0 ? 1 : -1;
      car.angle -= steer * 1.9 * dir * dt;

      if (!drag && camMode !== 2) {
        let angleDiff = car.angle - yaw;
        angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
        yaw += angleDiff * Math.min(1, dt * 2.8);
      }
    }

    if (car.wheels.length >= 2) {
      car.wheels[0].rotation.y = -steer * 0.45;
      car.wheels[1].rotation.y = -steer * 0.45;
      const roll = (car.speed * dt) / 0.38;
      car.wheels.forEach(w => {
        if (w.children && w.children[0]) w.children[0].rotation.x += roll;
      });
    }

    const vx = Math.sin(car.angle) * car.speed * dt;
    const vz = Math.cos(car.angle) * car.speed * dt;

    if (!checkCollision(car.x + vx, car.z)) car.x += vx; else car.speed = 0;
    if (!checkCollision(car.x, car.z + vz)) car.z += vz; else car.speed = 0;

    car.group.position.set(car.x, 0, car.z);
    car.group.rotation.y = car.angle;

    // Camera follow
    let targetCamX, targetCamY, targetCamZ;
    let targetLookX = car.x, targetLookY = 1.4, targetLookZ = car.z;

    if (camMode === 0) {
      const d = 8.5 + (Math.abs(car.speed) / car.maxSpeed) * 1.8;
      targetCamX = car.x - Math.sin(yaw) * Math.cos(pitch) * d;
      targetCamZ = car.z - Math.cos(yaw) * Math.cos(pitch) * d;
      targetCamY = Math.max(0.8, 1.8 + Math.sin(pitch) * d);
    } else if (camMode === 1) {
      const d = 13.5;
      targetCamX = car.x - Math.sin(yaw) * Math.cos(pitch) * d;
      targetCamZ = car.z - Math.cos(yaw) * Math.cos(pitch) * d;
      targetCamY = Math.max(1.2, 3.2 + Math.sin(pitch) * d);
    } else {
      yaw = car.angle;
      targetCamX = car.x + Math.sin(car.angle) * 0.7;
      targetCamZ = car.z + Math.cos(car.angle) * 0.7;
      targetCamY = 1.15;
      targetLookX = car.x + Math.sin(car.angle) * 20;
      targetLookY = 1.15;
      targetLookZ = car.z + Math.cos(car.angle) * 20;
    }

    const lerpFactor = 1 - Math.exp(-14 * dt);
    camera.position.x += (targetCamX - camera.position.x) * lerpFactor;
    camera.position.y += (targetCamY - camera.position.y) * lerpFactor;
    camera.position.z += (targetCamZ - camera.position.z) * lerpFactor;

    lookTarget.x += (targetLookX - lookTarget.x) * lerpFactor;
    lookTarget.y += (targetLookY - lookTarget.y) * lerpFactor;
    lookTarget.z += (targetLookZ - lookTarget.z) * lerpFactor;
    camera.lookAt(lookTarget);

  } else {
    prevLeftWheel = null;
    prevRightWheel = null;

    const len = Math.hypot(ix, iz);
    if (len > 1) { ix /= len; iz /= len; }
    const isMoving = len > 0.05;
    const isRunning = running || k.shift;
    const speed = isRunning ? 9.5 : 4.5;

    if (isMoving) {
      const f = -iz;
      const s = ix;

      const dx = (f * Math.sin(yaw) - s * Math.cos(yaw)) * speed * dt;
      const dz = (f * Math.cos(yaw) + s * Math.sin(yaw)) * speed * dt;

      const nextX = player.x + dx;
      if (!checkCollision(nextX, player.z)) player.x = nextX;

      const nextZ = player.z + dz;
      if (!checkCollision(player.x, nextZ)) player.z = nextZ;

      player.angle = Math.atan2(dx, dz);

      const swingSpeed = isRunning ? 16 : 9;
      const swingAngle = isRunning ? 0.8 : 0.45;
      const swing = Math.sin(animTime * swingSpeed) * swingAngle;

      legL.rotation.x = swing;
      legR.rotation.x = -swing;
      armL.rotation.x = -swing * 0.9;
      armR.rotation.x = swing * 0.9;

      torsoMesh.position.y = 1.28 + Math.abs(Math.sin(animTime * swingSpeed)) * 0.06;
      head.position.y = 1.88 + Math.abs(Math.sin(animTime * swingSpeed)) * 0.06;

      const stepInterval = isRunning ? 0.28 : 0.44;
      if (animTime - lastStepTime > stepInterval) {
        playFootstep();
        lastStepTime = animTime;
      }
    } else {
      legL.rotation.x = 0;
      legR.rotation.x = 0;
      armL.rotation.x = 0;
      armR.rotation.x = 0;
      torsoMesh.position.y = 1.28 + Math.sin(animTime * 2.5) * 0.015;
      head.position.y = 1.88 + Math.sin(animTime * 2.5) * 0.015;
    }

    player.vy -= 22 * dt;
    player.y += player.vy * dt;
    if (player.y <= 0) { player.y = 0; player.vy = 0; }

    playerGroup.position.set(player.x, player.y, player.z);
    playerGroup.rotation.y = player.angle;

    let targetCamX, targetCamY, targetCamZ;
    let targetLookX = player.x, targetLookY = player.y + 1.35, targetLookZ = player.z;

    if (camMode === 0) {
      const d = 6.0;
      targetCamX = player.x - Math.sin(yaw) * Math.cos(pitch) * d;
      targetCamZ = player.z - Math.cos(yaw) * Math.cos(pitch) * d;
      targetCamY = Math.max(0.6, player.y + 1.6 + Math.sin(pitch) * d);
    } else if (camMode === 1) {
      const d = 10.5;
      targetCamX = player.x - Math.sin(yaw) * Math.cos(pitch) * d;
      targetCamZ = player.z - Math.cos(yaw) * Math.cos(pitch) * d;
      targetCamY = Math.max(1.0, player.y + 3.0 + Math.sin(pitch) * d);
    } else {
      yaw = player.angle;
      targetCamX = player.x + Math.sin(player.angle) * 0.2;
      targetCamZ = player.z + Math.cos(player.angle) * 0.2;
      targetCamY = player.y + 1.88;
      targetLookX = player.x + Math.sin(player.angle) * 15;
      targetLookY = player.y + 1.88;
      targetLookZ = player.z + Math.cos(player.angle) * 15;
    }

    const lerpFactor = 1 - Math.exp(-14 * dt);
    camera.position.x += (targetCamX - camera.position.x) * lerpFactor;
    camera.position.y += (targetCamY - camera.position.y) * lerpFactor;
    camera.position.z += (targetCamZ - camera.position.z) * lerpFactor;

    lookTarget.x += (targetLookX - lookTarget.x) * lerpFactor;
    lookTarget.y += ((player.y + 1.35) - lookTarget.y) * lerpFactor;
    lookTarget.z += (player.z - lookTarget.z) * lerpFactor;
    camera.lookAt(lookTarget);
  }

  renderRotatingMinimap();
}

// Input Events
window.keys = {};
addEventListener('keydown', e => window.keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => window.keys[e.key.toLowerCase()] = false);

const joy = document.getElementById('joy'), stick = document.getElementById('stick');
let joyActive = false;
function joySet(e) {
  const r = joy.getBoundingClientRect();
  let x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
  const max = 50, l = Math.hypot(x, y);
  if (l > max) { x = x * max / l; y = y * max / l; }
  joyX = x / max; joyY = y / max;
  stick.style.transform = `translate(${x}px, ${y}px)`;
}
joy.addEventListener('pointerdown', e => { joyActive = true; joy.setPointerCapture(e.pointerId); joySet(e); });
joy.addEventListener('pointermove', e => { if (joyActive) joySet(e); });
['pointerup', 'pointercancel'].forEach(t => joy.addEventListener(t, () => {
  joyActive = false; joyX = 0; joyY = 0; stick.style.transform = 'translate(0, 0)';
}));

const look = document.getElementById('look');
look.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; look.setPointerCapture(e.pointerId); });
look.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  yaw -= dx * 0.0055;
  pitch = Math.max(-0.15, Math.min(1.15, pitch + dy * 0.005));
});
['pointerup', 'pointercancel'].forEach(t => look.addEventListener(t, () => drag = false));

runBtn.addEventListener('pointerdown', () => running = true);
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => runBtn.addEventListener(t, () => running = false));

jumpBtn.addEventListener('pointerdown', () => {
  if (!inCar && player.y <= 0.02) player.vy = 7.5;
});

function resize() {
  const w = window.innerWidth || document.documentElement.clientWidth || 360;
  const h = window.innerHeight || document.documentElement.clientHeight || 640;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

function loop(now) {
  const dt = Math.min(0.04, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
